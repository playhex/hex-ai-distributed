<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>PlayHex AI worker</title>
    <meta name="description" content="Lend your GPU to PlayHex: run Katahex tree search in this tab for bot moves and game analyses.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%237b1fff' d='M8 .5 14.5 4.25v7.5L8 15.5 1.5 11.75v-7.5z'/%3E%3C/svg%3E">
  <script type="module" crossorigin src="./assets/main-DW-HGB-0.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/stats-BlkADAxk.js">
  <link rel="stylesheet" crossorigin href="./assets/stats-CH1DUsWt.css">
</head>
<body>
    <div class="app" data-state="login">
        <main class="main">
            <a class="brand" href="https://playhex.org" target="_blank" rel="noopener">
                <span id="brand-icon" class="brand-icon"></span>
                <span>PlayHex <strong>AI worker</strong></span>
            </a>

            <div class="center">
                <ul id="checklist" class="checklist" hidden>
                    <li id="check-login" class="check">
                        <span class="check-icon"></span>
                        <span class="check-label"></span>
                        <button id="login" class="check-action" type="button">Log in with PlayHex</button>
                        <button id="logout" class="check-secondary" type="button">Log out</button>
                    </li>
                    <li id="check-key" class="check" hidden>
                        <span class="check-icon"></span>
                        <span class="check-label"></span>
                        <button id="login-again" class="check-action" type="button">Try login again</button>
                    </li>
                    <li id="check-gpu" class="check">
                        <span class="check-icon"></span>
                        <span class="check-label"></span>
                        <a id="gpu-help" class="check-action" target="_blank" rel="noopener" hidden>How to enable</a>
                    </li>
                    <li id="check-jobs" class="check" hidden>
                        <span class="check-icon"></span>
                        <span class="check-label"></span>
                    </li>
                </ul>

                <button id="toggle" class="toggle" type="button" aria-label="Start">
                    <svg class="hex" viewBox="0 0 100 115.47" aria-hidden="true">
                        <polygon class="hex-fill" points="50,1.5 98.7,29.6 98.7,85.9 50,114 1.3,85.9 1.3,29.6"></polygon>
                        <polygon id="ring-progress" class="hex-progress" points="50,1.5 98.7,29.6 98.7,85.9 50,114 1.3,85.9 1.3,29.6" pathLength="1"></polygon>
                    </svg>
                    <span id="toggle-icon" class="toggle-icon"></span>
                    <span id="toggle-label" class="toggle-label"></span>
                </button>

                <div class="status">
                    <span class="status-dot"></span>
                    <span id="status-text"></span>
                </div>
                <div id="status-detail" class="status-detail num"></div>
                <div id="progress" class="progress" style="visibility: hidden"><span id="progress-fill"></span></div>
            </div>

            <section id="jobs" class="jobs" hidden>
                <h2>Last jobs</h2>
                <table>
                    <tbody id="jobs-list"></tbody>
                </table>
                <button id="jobs-more" class="link more" type="button" hidden>Show more</button>
            </section>
        </main>

        <aside class="sidebar">
            <section>
                <h2>Jobs to take</h2>
                <div id="job-types" class="job-types"></div>
            </section>

            <section id="key-field" hidden>
                <label class="field">
                    <span class="field-label">Worker key</span>
                    <select id="key"></select>
                </label>
            </section>

            <section>
                <h2>Stats</h2>
                <dl class="stats">
                    <dt>This session</dt><dd id="stat-session" class="num">0</dd>
                    <dt>Total</dt><dd id="stat-total" class="num">0</dd>
                    <dt>Average time</dt><dd id="stat-duration" class="num">–</dd>
                </dl>
                <div id="activity" class="activity" title="Jobs, last 7 days"></div>
            </section>

            <a class="details-link" href="./stats.html"><span id="stats-icon"></span>Durations by job and board size</a>

            <div id="debug" class="debug"></div>

            <footer class="footer">
                <a href="https://github.com/playhex/hex-ai-distributed" target="_blank" rel="noopener"><span id="github-icon"></span>Source code</a>
                <button id="forget" class="link" type="button" hidden><span id="logout-icon"></span>Log out</button>
            </footer>
        </aside>
    </div>

</body>
</html>
